syntax = "proto3";

package archlabs.storage;

option java_package = "ru.archlabs.proto.storage";
option java_multiple_files = true;
option java_outer_classname = "StorageProto";

import "common.proto";

service StorageService {
  rpc ResetOnlineUsers(archlabs.common.Empty) returns (archlabs.common.Empty);
  rpc Connect(ConnectRequest) returns (archlabs.common.UserState);
  rpc Disconnect(ConnectRequest) returns (archlabs.common.UserState);
  rpc SetNotifications(SetNotificationsRequest) returns (archlabs.common.Empty);
  rpc FindUser(UserRequest) returns (archlabs.common.UserState);
  rpc ListUsers(archlabs.common.Empty) returns (UsersResponse);
  rpc AppendMessage(AppendMessageRequest) returns (archlabs.common.ChatMessage);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc EnqueueNotification(EnqueueNotificationRequest) returns (archlabs.common.ChatNotification);
  rpc PendingNotifications(UserRequest) returns (NotificationsResponse);
  rpc MarkNotificationDelivered(MarkDeliveredRequest) returns (archlabs.common.Empty);
}

message ConnectRequest {
  string name = 1;
  int64 at_epoch_millis = 2;
}

message UserRequest {
  string name = 1;
}

message SetNotificationsRequest {
  string name = 1;
  bool enabled = 2;
}

message UsersResponse {
  repeated archlabs.common.UserState users = 1;
}

message AppendMessageRequest {
  string sender = 1;
  string text = 2;
  repeated string recipients = 3;
  int64 at_epoch_millis = 4;
}

message HistoryRequest {
  int32 limit = 1;
}

message HistoryResponse {
  repeated archlabs.common.ChatMessage messages = 1;
}

message EnqueueNotificationRequest {
  string recipient = 1;
  archlabs.common.ChatMessage message = 2;
  int64 at_epoch_millis = 3;
}

message NotificationsResponse {
  repeated archlabs.common.ChatNotification notifications = 1;
}

message MarkDeliveredRequest {
  int64 id = 1;
  int64 at_epoch_millis = 2;
}
