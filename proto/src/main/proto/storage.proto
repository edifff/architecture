syntax = "proto3";

package storage;

option java_multiple_files = true;
option java_package = "ru.archlabs.proto.storage";

import "common.proto";
import "google/protobuf/timestamp.proto";

// Контракт слоя хранения: 1-в-1 повторяет доменный интерфейс ChatStorage.
// Ошибки маппятся по общему соглашению (StorageException -> INTERNAL,
// отсутствующий пользователь -> NOT_FOUND, пустое имя -> INVALID_ARGUMENT).
service ChatStorage {
  // connect(name, at)
  rpc Connect(ConnectRequest) returns (common.Empty);

  // disconnect(name, at)
  rpc Disconnect(DisconnectRequest) returns (common.Empty);

  // setNotificationsEnabled(name, enabled)
  rpc SetNotificationsEnabled(SetNotificationsEnabledRequest) returns (common.Empty);

  // append(sender, text, sentAt) -> сохранённое сообщение с присвоенным id
  rpc Append(AppendRequest) returns (common.Message);

  // undeliveredNotifications(recipient) -> очередь недоставленных оповещений
  rpc UndeliveredNotifications(UndeliveredNotificationsRequest) returns (MessagesResponse);

  // clearNotifications(recipient, messageIds)
  rpc ClearNotifications(ClearNotificationsRequest) returns (common.Empty);

  // history() -> все сообщения чата
  rpc History(HistoryRequest) returns (MessagesResponse);

  // user(name); отсутствующий пользователь -> NOT_FOUND
  rpc User(UserRequest) returns (common.UserState);

  // onlineUsersWithNotificationsEnabled() -> кандидаты на доставку
  rpc OnlineUsersWithNotificationsEnabled(common.Empty) returns (UserStatesResponse);

  // resetOnlineUsers(): «после рестарта никто не онлайн». Сейчас эта операция
  // приватна и вызывается конструктором хранилища; как RPC она нужна сервису
  // чата, чтобы выполнить её у себя при старте — семантика «никто не онлайн»
  // принадлежит слою, который владеет сессиями.
  rpc ResetOnlineUsers(common.Empty) returns (common.Empty);
}

message ConnectRequest {
  string name = 1;
  google.protobuf.Timestamp at = 2;
}

message DisconnectRequest {
  string name = 1;
  google.protobuf.Timestamp at = 2;
}

message SetNotificationsEnabledRequest {
  string name = 1;
  bool enabled = 2;
}

message AppendRequest {
  string sender = 1;
  string text = 2;
  google.protobuf.Timestamp sent_at = 3;
}

message UndeliveredNotificationsRequest {
  string recipient = 1;
}

message ClearNotificationsRequest {
  string recipient = 1;
  repeated int64 message_ids = 2;
}

message HistoryRequest {
}

message UserRequest {
  string name = 1;
}

// Обёртка для RPC с несколькими результатами (gRPC возвращает одно сообщение).
message MessagesResponse {
  repeated common.Message messages = 1;
}

message UserStatesResponse {
  repeated common.UserState users = 1;
}
