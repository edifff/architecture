syntax = "proto3";

package chat;

option java_multiple_files = true;
option java_package = "ru.archlabs.proto.chat";

import "common.proto";

// Контракт доменного слоя, который потребляет фронтенд. Каждый RPC повторяет
// поведение одноимённой операции клиентского HTTP-протокола:
//
//   Connect                 -> POST   /sessions/{u}
//   Disconnect              -> DELETE /sessions/{u}
//   Send                    -> POST   /messages/{u}
//   History                 -> GET    /messages/{u}
//   SetNotificationsEnabled -> PUT    /notifications/{u}
//   User                    -> GET    /users/{u}
//   Subscribe               -> GET    /events/{u} (SSE)
//
// Состояние сессий живёт в сервисе чата и ключуется именем пользователя;
// Connect регистрирует сессию, Subscribe открывает поток выдачи (пользователь
// может быть подключён и без открытой подписи — как сегодня клиент может
// создать сессию, не открывая /events), Disconnect снимает и то и другое.
service ChatService {
  // Уже подключённое имя -> ALREADY_EXISTS, пустое имя -> INVALID_ARGUMENT.
  rpc Connect(ConnectRequest) returns (ConnectResponse);

  rpc Disconnect(DisconnectRequest) returns (common.Empty);

  // Нет активной сессии -> FAILED_PRECONDITION.
  rpc Send(SendRequest) returns (common.Message);

  // Нет активной сессии или история до отключения уведомлений -> FAILED_PRECONDITION.
  rpc History(HistoryRequest) returns (MessagesResponse);

  rpc SetNotificationsEnabled(SetNotificationsEnabledRequest) returns (common.Empty);

  // Отсутствующий пользователь -> NOT_FOUND.
  rpc User(UserRequest) returns (common.UserState);

  // Основа SSE: фронтенд открывает один поток на подключённого пользователя,
  // сервис чата пушит в него живые оповещения. Нет активной сессии -> FAILED_PRECONDITION.
  rpc Subscribe(SubscribeRequest) returns (stream common.Message);
}

message ConnectRequest {
  string name = 1;
}

message ConnectResponse {
  common.UserState user = 1;
}

message DisconnectRequest {
  string name = 1;
}

message SendRequest {
  string name = 1;
  string text = 2;
}

message HistoryRequest {
  string name = 1;
}

// Обёртка для истории: gRPC возвращает одно сообщение, поэтому repeated
// поле вынесено в ответ.
message MessagesResponse {
  repeated common.Message messages = 1;
}

message SetNotificationsEnabledRequest {
  string name = 1;
  bool enabled = 2;
}

message UserRequest {
  string name = 1;
}

message SubscribeRequest {
  string name = 1;
}
