syntax = "proto3";

package archlabs.chat;

option java_package = "ru.archlabs.proto.chat";
option java_multiple_files = true;
option java_outer_classname = "ChatProto";

import "common.proto";

service ChatService {
  rpc Connect(ConnectRequest) returns (archlabs.common.UserState);
  rpc Disconnect(UserRequest) returns (archlabs.common.Empty);
  rpc Send(SendMessageRequest) returns (archlabs.common.ChatMessage);
  rpc Deliver(DeliverRequest) returns (DeliveryReport);
  rpc SendStatus(SendMessageRequest) returns (StatusSendResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc LocalHistory(LocalHistoryRequest) returns (HistoryResponse);
  rpc SetNotifications(SetNotificationsRequest) returns (archlabs.common.Empty);
  rpc GetUser(UserRequest) returns (archlabs.common.UserState);
  rpc Subscribe(UserRequest) returns (stream archlabs.common.ChatMessage);
}

message ConnectRequest {
  string name = 1;
}

message UserRequest {
  string name = 1;
}

message SendMessageRequest {
  string name = 1;
  string text = 2;
}

message HistoryRequest {
  string name = 1;
  int32 limit = 2;
}

message HistoryResponse {
  repeated archlabs.common.ChatMessage messages = 1;
}

message LocalHistoryRequest {
  int32 limit = 1;
}

message SetNotificationsRequest {
  string name = 1;
  bool enabled = 2;
}

message DeliverRequest {
  archlabs.common.ChatMessage message = 1;
}

message DeliveryReport {
  string shard = 1;
  int32 chats = 2;
  int32 delivered = 3;
  int32 queued = 4;
}

message StatusSendResponse {
  archlabs.common.ChatMessage message = 1;
  DeliveryReport delivery = 2;
}
