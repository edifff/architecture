global:
  scrape_interval: 5s

scrape_configs:
  - job_name: archlabs-api
    static_configs:
      - targets: ["api:9100"]
  - job_name: archlabs-chat
    static_configs:
      - targets:
          - "chat-1:9101"
          - "chat-2:9101"
          - "chat-3:9101"
  - job_name: archlabs-storage
    static_configs:
      - targets:
          - "storage-1:9102"
          - "storage-2:9102"
          - "storage-3:9102"
