services:
  # Для масштабирования фиксированные host-порты мешают: несколько реплик
  # не могут занять один порт. Внутри сети сервисы доступны по DNS-именам.
  chat:
    ports: !reset []
  storage:
    ports: !reset []
  api:
    ports: !reset []
  prometheus:
    ports: !reset []
  grafana:
    ports: !reset []
