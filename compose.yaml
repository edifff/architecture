name: arch-labs

# Слоистая архитектура:
#   api     — входной элемент: Netty HTTP/SSE + Facade (gRPC-клиент к chat);
#   chat    — доменный слой (gRPC);
#   storage — слой хранения (gRPC + JDBC);
#   db      — PostgreSQL.
#
# docker compose up --build
# docker compose --profile test run --rm tests

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5433:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    build:
      context: .
      target: storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      CHAT_DB_URL: jdbc:postgresql://db:5432/chat
      CHAT_DB_USER: chat
      CHAT_DB_PASSWORD: chat
      STORAGE_GRPC_PORT: "50051"
      METRICS_PORT: "9102"
    ports:
      - "50051:50051"
      - "9102:9102"
    restart: unless-stopped

  chat:
    build:
      context: .
      target: chat
    depends_on:
      - storage
    environment:
      CHAT_GRPC_PORT: "50052"
      STORAGE_HOST: storage
      STORAGE_GRPC_PORT: "50051"
      METRICS_PORT: "9101"
    ports:
      - "50052:50052"
      - "9101:9101"
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    depends_on:
      - chat
    environment:
      CHAT_HTTP_PORT: "8080"
      CHAT_HOST: chat
      CHAT_GRPC_PORT: "50052"
    ports:
      - "8080:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - chat
      - storage
    volumes:
      - ./perf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./perf/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./perf/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  tests:
    image: maven:3.9-eclipse-temurin-25
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-1001}"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.m2:/maven-cache
    environment:
      HOME: /workspace
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: mvn -B -ntp -Dmaven.repo.local=/maven-cache test
    profiles: ["test"]

volumes:
  chat-db-data:
