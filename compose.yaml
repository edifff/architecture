x-storage-shard: &storage-shard
  build:
    context: .
    args:
      MODULE: storage-service
  image: arch-labs-storage:dev
  restart: unless-stopped

x-chat-shard: &chat-shard
  build:
    context: .
    args:
      MODULE: chat-service
  image: arch-labs-chat-service:dev
  restart: unless-stopped

services:
  storage-1:
    <<: *storage-shard
    environment:
      ARCHLABS_DB_URL: "jdbc:h2:file:/data/chat;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0"
      STORAGE_PORT: "9092"
      STORAGE_METRICS_PORT: "9102"
      HEALTH_PORT: "9102"
      SHARD_INDEX: "0"
      SHARD_COUNT: "3"
      SHARD_ID: "storage-1"
    ports:
      - "9191:9092"
      - "9111:9102"
    volumes:
      - storage-1-data:/data

  storage-2:
    <<: *storage-shard
    environment:
      ARCHLABS_DB_URL: "jdbc:h2:file:/data/chat;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0"
      STORAGE_PORT: "9092"
      STORAGE_METRICS_PORT: "9102"
      HEALTH_PORT: "9102"
      SHARD_INDEX: "1"
      SHARD_COUNT: "3"
      SHARD_ID: "storage-2"
    ports:
      - "9192:9092"
      - "9112:9102"
    volumes:
      - storage-2-data:/data

  storage-3:
    <<: *storage-shard
    environment:
      ARCHLABS_DB_URL: "jdbc:h2:file:/data/chat;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0"
      STORAGE_PORT: "9092"
      STORAGE_METRICS_PORT: "9102"
      HEALTH_PORT: "9102"
      SHARD_INDEX: "2"
      SHARD_COUNT: "3"
      SHARD_ID: "storage-3"
    ports:
      - "9193:9092"
      - "9113:9102"
    volumes:
      - storage-3-data:/data

  chat-1:
    <<: *chat-shard
    environment:
      STORAGE_HOST: storage-1
      STORAGE_PORT: "9092"
      CHAT_PORT: "9091"
      CHAT_METRICS_PORT: "9101"
      HEALTH_PORT: "9101"
      SHARD_INDEX: "0"
      SHARD_ID: "chat-1"
    ports:
      - "9091:9091"
      - "9101:9101"
    depends_on:
      storage-1:
        condition: service_healthy

  chat-2:
    <<: *chat-shard
    environment:
      STORAGE_HOST: storage-2
      STORAGE_PORT: "9092"
      CHAT_PORT: "9091"
      CHAT_METRICS_PORT: "9101"
      HEALTH_PORT: "9101"
      SHARD_INDEX: "1"
      SHARD_ID: "chat-2"
    ports:
      - "9092:9091"
      - "9102:9101"
    depends_on:
      storage-2:
        condition: service_healthy

  chat-3:
    <<: *chat-shard
    environment:
      STORAGE_HOST: storage-3
      STORAGE_PORT: "9092"
      CHAT_PORT: "9091"
      CHAT_METRICS_PORT: "9101"
      HEALTH_PORT: "9101"
      SHARD_INDEX: "2"
      SHARD_ID: "chat-3"
    ports:
      - "9093:9091"
      - "9103:9101"
    depends_on:
      storage-3:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        MODULE: api
    image: arch-labs-api:dev
    environment:
      CHAT_SHARDS: "chat-1@chat-1:9091,chat-2@chat-2:9091,chat-3@chat-3:9091"
      ARCHLABS_HTTP_PORT: "8080"
      ARCHLABS_METRICS_PORT: "9100"
      HEALTH_PORT: "9100"
    ports:
      - "8080:8080"
      - "9100:9100"
    depends_on:
      chat-1:
        condition: service_healthy
      chat-2:
        condition: service_healthy
      chat-3:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./perf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      chat-1:
        condition: service_healthy
      chat-2:
        condition: service_healthy
      chat-3:
        condition: service_healthy
      storage-1:
        condition: service_healthy
      storage-2:
        condition: service_healthy
      storage-3:
        condition: service_healthy

  storage-single:
    profiles:
      - single
    build:
      context: .
      args:
        MODULE: storage-service
    image: arch-labs-storage:dev
    environment:
      ARCHLABS_DB_URL: "jdbc:h2:file:/data/chat;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0"
      STORAGE_PORT: "9092"
      STORAGE_METRICS_PORT: "9102"
      HEALTH_PORT: "9102"
      SHARD_INDEX: "0"
      SHARD_COUNT: "1"
      SHARD_ID: "storage-single"
    ports:
      - "9190:9092"
      - "9114:9102"
    volumes:
      - chat-data:/data
    restart: unless-stopped

  chat-single:
    profiles:
      - single
    build:
      context: .
      args:
        MODULE: chat-service
    image: arch-labs-chat-service:dev
    environment:
      STORAGE_HOST: storage-single
      STORAGE_PORT: "9092"
      CHAT_PORT: "9091"
      CHAT_METRICS_PORT: "9101"
      HEALTH_PORT: "9101"
      SHARD_INDEX: "0"
      SHARD_ID: "chat-single"
    ports:
      - "9089:9091"
      - "9109:9101"
    depends_on:
      storage-single:
        condition: service_healthy
    restart: unless-stopped

  api-single:
    profiles:
      - single
    build:
      context: .
      args:
        MODULE: api
    image: arch-labs-api:dev
    environment:
      CHAT_HOST: chat-single
      CHAT_PORT: "9091"
      ARCHLABS_HTTP_PORT: "8085"
      ARCHLABS_METRICS_PORT: "9105"
      HEALTH_PORT: "9105"
    ports:
      - "8085:8085"
      - "9105:9105"
    depends_on:
      chat-single:
        condition: service_healthy
    restart: unless-stopped

  app:
    profiles:
      - monolith
    build:
      context: .
      args:
        MODULE: app
    image: arch-labs-chat:dev
    environment:
      ARCHLABS_DB_URL: "jdbc:h2:file:/data/chat;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0"
      ARCHLABS_HTTP_PORT: "8080"
      ARCHLABS_METRICS_PORT: "9100"
      HEALTH_PORT: "9100"
    ports:
      - "8081:8080"
      - "9110:9100"
    volumes:
      - app-data:/data
    restart: unless-stopped

  tests:
    build:
      context: .
      target: test
    image: arch-labs-tests:dev
    profiles:
      - test

volumes:
  storage-1-data:
  storage-2-data:
  storage-3-data:
  chat-data:
  app-data:
  prometheus-data:
